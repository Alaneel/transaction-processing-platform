openapi: 3.1.0
info:
  title: Transaction Processing Platform
  version: 0.2.6
  description: Educational ledger and asynchronous transfer activity using fictional FIC integer minor units. No authentication; bind locally.
servers:
  - url: http://localhost:8080
paths:
  /api/accounts:
    post:
      summary: Create an empty USER account
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [unit]
              properties:
                unit: {type: string, const: FIC}
            example: {unit: FIC}
      responses:
        '201':
          description: Created with Location header
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '400': {$ref: '#/components/responses/Invalid'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/accounts/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      summary: Get a USER account
      operationId: getAccount
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '400': {$ref: '#/components/responses/Invalid'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/accounts/{id}/balance:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      summary: Get materialized balance
      operationId: getBalance
      responses:
        '200':
          description: Transactional ledger projection
          content:
            application/json:
              schema:
                type: object
                required: [accountId, unit, amount]
                properties:
                  accountId: {type: string, format: uuid}
                  unit: {type: string, const: FIC}
                  amount: {type: integer, format: int64, minimum: 0, maximum: 9000000000000000}
        '400': {$ref: '#/components/responses/Invalid'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/accounts/{id}/ledger:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      summary: List immutable postings in ascending identifier order
      operationId: listLedger
      parameters:
        - name: after
          in: query
          schema: {type: integer, format: int64, minimum: 0, default: 0}
          description: Exclusive entry identifier cursor
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Page; null nextCursor means no further entries currently visible
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/LedgerEntry'}
                  nextCursor: {type: [integer, 'null'], format: int64}
        '400': {$ref: '#/components/responses/Invalid'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/transfers:
    post:
      summary: Submit a synchronous transfer with a globally unique durable idempotency key
      operationId: submitTransfer
      description: Same key and payload replays the committed terminal result. Different payload conflicts. Business rejections are durable. Invalid syntax and confirmed rollback leave no durable key. Connection loss around commit can leave a durable result; recover it using the same key and payload. PROCESSING is never externally visible or committed.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$'}
        - name: X-Correlation-ID
          in: header
          schema: {type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransferRequest'}
            example:
              sourceAccountId: 00000000-0000-0000-0000-000000000002
              destinationAccountId: 00000000-0000-0000-0000-000000000003
              amount: 100
              unit: FIC
      responses:
        '201':
          description: New COMPLETED transfer; response is emitted after database commit
          headers:
            Location: {schema: {type: string}}
            Idempotency-Replayed: {schema: {type: string, const: 'false'}}
            X-Correlation-ID: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Transfer'}
        '200':
          description: Previously COMPLETED transfer replay; Idempotency-Replayed true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Transfer'}
        '422':
          description: Durable REJECTED transfer, new or replayed. Inspect rejectionCode and Idempotency-Replayed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Transfer'}
        '400': {$ref: '#/components/responses/Invalid'}
        '409':
          description: IDEMPOTENCY_CONFLICT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: Internal failure; the operation may have committed. Retry with the identical key and payload.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Dependency/timeout failure, or enabled backlog admission refused the new reservation (EVENT_BACKLOG_OVERLOADED or BACKLOG_STATUS_UNAVAILABLE). Retry with the identical key and payload. Admission refusal rolls back the key and financial effects; dependency failures can be ambiguous.
          headers:
            Retry-After: {schema: {type: string, const: '1'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/transfers/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      summary: Get a terminal transfer result
      operationId: getTransfer
      responses:
        '200':
          description: Durable result (COMPLETED or REJECTED)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Transfer'}
        '400': {$ref: '#/components/responses/Invalid'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /internal/transfers/{id}/delivery:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      summary: Inspect durable transfer and event delivery progress by transfer ID
      operationId: inspectTransferDelivery
      description: >-
        Trusted local, read-only inspection of a single PostgreSQL snapshot. A completed
        transfer has already committed its financial effects even if delivery is pending.
        PROJECTED can be observed before the relay commits PUBLISHED, because the consumer
        can receive the event first. The result does not confirm a Kafka group offset commit.
      responses:
        '200':
          description: Terminal transfer decision and observed event progress
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransferDelivery'}
        '400': {$ref: '#/components/responses/Invalid'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503':
          description: Delivery progress could not be read. Retry this status request.
          headers:
            Retry-After: {schema: {type: string, const: '1'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /internal/transfers/{id}/ledger-proof:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      summary: Inspect the immutable postings recorded for one transfer ID
      operationId: inspectTransferLedgerProof
      description: >-
        Trusted local, read-only inspection using one PostgreSQL snapshot. A balanced
        pair confirms the exact debit and credit underlying the terminal decision for
        this ID. It does not inspect other transfers, current account balances,
        Kafka publication, or projection. Inconsistent data may return a bounded
        sample of up to three postings, not an exhaustive account history.
      responses:
        '200':
          description: Terminal transfer intent and its observed immutable posting rows
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransferLedgerProof'}
        '400': {$ref: '#/components/responses/Invalid'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /internal/demo/transfers:
    get:
      summary: Browse recent fictional transfer decisions
      operationId: listRecentDemoTransfers
      description: >-
        Read-only pages of committed or rejected transfers between the two seeded
        demo accounts, newest recorded decision first. Funding and unrelated accounts
        are excluded. Keyset pagination uses the recorded decision time and transfer ID.
        No receipts, idempotency keys, or event delivery decisions are returned.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 20, default: 6}
        - name: before
          in: query
          description: Opaque token returned as nextBefore on the previous page.
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{39}$'}
      responses:
        '200':
          description: Page of terminal decisions
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DemoTransferHistoryPage'}
        '400': {$ref: '#/components/responses/Invalid'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /internal/demo/delivery-attention:
    get:
      summary: Find delivery exceptions within the latest completed demo transfers
      operationId: listDemoDeliveryAttention
      description: >-
        A read-only PostgreSQL observation of at most the latest 50 completed transfers
        between the two seeded demo accounts. Fully settled transfers are counted in
        the sample but omitted from items. Items are ordered by attention severity and
        then oldest decision first. This is not a global backlog or a search of older
        history. No receipt, key, or raw event payload is returned.
      responses:
        '200':
          description: Bounded sample coverage and the items that need review
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DemoDeliveryAttention'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /internal/reconciliation:
    get:
      summary: Reconcile all balances and journals in one read-only repeatable-read snapshot
      operationId: reconcile
      responses:
        '200':
          description: Report; consistent false signals corruption and does not repair it
          content:
            application/json:
              schema:
                type: object
                required: [consistent, balanceMismatches, invalidTransfers, totalLedgerDelta, totalMaterializedBalance]
                properties:
                  consistent: {type: boolean}
                  balanceMismatches:
                    type: array
                    items:
                      type: object
                      properties:
                        accountId: {type: string, format: uuid}
                        materialized: {type: [integer, 'null']}
                        ledger: {type: integer}
                  invalidTransfers: {type: array, items: {type: string, format: uuid}}
                  totalLedgerDelta: {type: integer}
                  totalMaterializedBalance: {type: integer}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/accounts/{id}/activity:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Read Kafka-derived eventual account activity
      operationId: getActivity
      responses:
        '200':
          description: Live page ordered by projection ID. Refresh from zero to discover late concurrent commits.
            It is not the authoritative ledger.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: after
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 0
        description: Exclusive immutable identifier cursor; refresh from zero for late projection commits.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
  /internal/backpressure:
    get:
      summary: Inspect optional sampled backlog admission and freshness
      operationId: getBackpressureStatus
      description: Trusted local operator endpoint. Thresholds are best-effort operating signals, allowing concurrent overshoot. Cached status does not query PostgreSQL. Disabled policy admits new requests. Enabled policy blocks new reservations when pressure is high or evidence is unavailable/stale; existing-key replay and conflict arbitration still proceed.
      responses:
        '200':
          description: Current admission status, including disabled or blocked states
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackpressureStatus'}
  /internal/events/status:
    get:
      summary: Inspect publication backlog and enabled workers
      operationId: getEventStatus
      responses:
        '200':
          description: Inspect publication backlog and enabled workers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventStatus'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/outbox/{eventId}:
    parameters:
    - name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Inspect one immutable event and publication/processing evidence
      operationId: inspectOutboxEvent
      responses:
        '200':
          description: Inspect one immutable event and publication/processing evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxInspection'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/outbox/{eventId}/requeues:
    parameters:
    - name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      summary: Audited requeue of a BLOCKED event after fixing its cause
      operationId: requeueOutboxEvent
      responses:
        '200':
          description: Audited requeue of a BLOCKED event after fixing its cause
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - eventId
                - status
                properties:
                  eventId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    const: PENDING
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          description: Conflict with current durable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequeueRequest'
  /internal/events/reconciliation:
    get:
      summary: Reconcile durable inbox and activity against completed origins
      operationId: reconcileEvents
      responses:
        '200':
          description: Repeatable-read report. missingProjection represents eventual lag; discrepancies counts structural
            violations and does not repair them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectionReport'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/events/reconciliation/status:
    get:
      summary: Alias for event reconciliation
      operationId: reconcileEventsStatus
      responses:
        '200':
          description: Alias for event reconciliation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectionReport'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/quarantine:
    get:
      summary: List durable poison evidence
      operationId: listQuarantine
      responses:
        '200':
          description: List durable poison evidence
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/QuarantineItem'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: after
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 0
        description: Exclusive immutable identifier cursor; refresh from zero for late projection commits.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
  /internal/quarantine/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      summary: Inspect original delivery and bounded evidence
      operationId: inspectQuarantine
      responses:
        '200':
          description: Inspect original delivery and bounded evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantineItem'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/quarantine/{id}/replays:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      summary: Read durable replay attempts including ambiguous STARTED attempts
      operationId: listQuarantineReplays
      responses:
        '200':
          description: Read durable replay attempts including ambiguous STARTED attempts
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: '#/components/schemas/ReplayAudit'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      summary: Reserve and execute one bounded audited replay
      operationId: replayQuarantine
      responses:
        '200':
          description: Terminal replay audit; REJECTED is a permanently invalid correction, DUPLICATE has no new business
            effect. A transient failure can leave a durable STARTED audit; inspect it before another bounded attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayResult'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          description: Conflict with current durable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayRequest'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Invalid:
      description: Invalid request; no durable transfer result reserved
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Requested resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: Dependency unavailable. Retry transfers with the same key and payload; do not infer financial failure from a lost response.
      headers:
        Retry-After: {schema: {type: string, const: '1'}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Account:
      type: object
      required: [id, status, unit, createdAt]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [ACTIVE, FROZEN]}
        unit: {type: string, const: FIC}
        createdAt: {type: string, format: date-time}
    TransferRequest:
      type: object
      additionalProperties: false
      required: [sourceAccountId, destinationAccountId, amount, unit]
      properties:
        sourceAccountId: {type: string, format: uuid}
        destinationAccountId: {type: string, format: uuid}
        amount: {type: integer, format: int64, minimum: 1, maximum: 9000000000000000}
        unit: {type: string, const: FIC}
    Transfer:
      type: object
      required: [id, sourceAccountId, destinationAccountId, amount, unit, status, rejectionCode, createdAt, completedAt]
      properties:
        id: {type: string, format: uuid}
        sourceAccountId: {type: string, format: uuid}
        destinationAccountId: {type: string, format: uuid}
        amount: {type: integer, format: int64}
        unit: {type: string, const: FIC}
        status: {type: string, enum: [COMPLETED, REJECTED]}
        rejectionCode:
          type: [string, 'null']
          enum: [null, ACCOUNT_NOT_FOUND, ACCOUNT_NOT_TRANSFERABLE, ACCOUNT_INACTIVE, UNIT_MISMATCH, INSUFFICIENT_FUNDS, BALANCE_LIMIT_EXCEEDED]
        createdAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
    TransferDelivery:
      type: object
      additionalProperties: false
      required: [transferId, transferStatus, decidedAt, deliveryState, event]
      properties:
        transferId: {type: string, format: uuid}
        transferStatus: {type: string, enum: [COMPLETED, REJECTED]}
        decidedAt: {type: string, format: date-time, description: Stored terminal decision timestamp.}
        deliveryState:
          type: string
          enum: [NOT_APPLICABLE, AWAITING_PUBLICATION, AWAITING_PROJECTION, BLOCKED, PROJECTED, INCONSISTENT]
          description: >-
            NOT_APPLICABLE is a rejected transfer with no event. AWAITING_PUBLICATION is a pending
            or claimed event without a projection. AWAITING_PROJECTION is a published event without
            a projection. BLOCKED is an unpublished blocked event without a projection. PROJECTED
            means matching inbox and projection records committed. INCONSISTENT indicates missing
            or conflicting durable records, rather than ordinary lag.
        event:
          oneOf:
            - {$ref: '#/components/schemas/TransferDeliveryEvent'}
            - {type: 'null'}
    TransferDeliveryEvent:
      type: object
      additionalProperties: false
      required: [eventId, publicationStatus, attemptCount, nextAttemptAt, lastErrorCode, publishedAt, processedAt, projectedAt]
      properties:
        eventId: {type: string, format: uuid}
        publicationStatus: {type: string, enum: [PENDING, CLAIMED, PUBLISHED, BLOCKED]}
        attemptCount: {type: integer, format: int32, minimum: 0}
        nextAttemptAt:
          type: [string, 'null']
          format: date-time
          description: Earliest scheduled attempt for a PENDING event. Null otherwise.
        lastErrorCode: {type: [string, 'null'], maxLength: 64}
        publishedAt: {type: [string, 'null'], format: date-time}
        processedAt: {type: [string, 'null'], format: date-time}
        projectedAt: {type: [string, 'null'], format: date-time}
    TransferLedgerProof:
      type: object
      additionalProperties: false
      required: [transferId, transferStatus, sourceAccountId, destinationAccountId, amount, unit, proofState, postings]
      properties:
        transferId: {type: string, format: uuid}
        transferStatus: {type: string, enum: [COMPLETED, REJECTED]}
        sourceAccountId: {type: string, format: uuid}
        destinationAccountId: {type: string, format: uuid}
        amount: {type: integer, format: int64, minimum: 1, maximum: 9000000000000000}
        unit: {type: string, const: FIC}
        proofState:
          type: string
          enum: [BALANCED_PAIR, NO_POSTINGS, INCONSISTENT]
          description: >-
            BALANCED_PAIR means exactly one matching source debit and one matching
            destination credit for the stored transfer amount. NO_POSTINGS means a
            rejected transfer without postings. INCONSISTENT means the observed
            rows do not match the terminal decision and stored transfer intent.
        postings:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [entryId, accountId, delta]
            properties:
              entryId:
                type: string
                pattern: '^[1-9][0-9]*$'
                description: Exact decimal identifier, represented as a string for browser precision.
              accountId: {type: string, format: uuid}
              delta: {type: integer, format: int64, minimum: -9000000000000000, maximum: 9000000000000000}
    DemoTransferHistoryPage:
      type: object
      additionalProperties: false
      required: [items, nextBefore]
      properties:
        items:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/DemoTransferHistoryRow'}
        nextBefore:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9_-]{39}$'
          description: Null when no earlier matching transfer is visible.
    DemoTransferHistoryRow:
      type: object
      additionalProperties: false
      required: [transferId, sourceAccountId, destinationAccountId, amount, unit, transferStatus, decidedAt, rejectionCode]
      properties:
        transferId: {type: string, format: uuid}
        sourceAccountId: {type: string, format: uuid}
        destinationAccountId: {type: string, format: uuid}
        amount: {type: integer, format: int64, minimum: 1, maximum: 9000000000000000}
        unit: {type: string, const: FIC}
        transferStatus: {type: string, enum: [COMPLETED, REJECTED]}
        decidedAt: {type: string, format: date-time}
        rejectionCode: {type: [string, 'null'], maxLength: 64}
    DemoDeliveryAttention:
      type: object
      additionalProperties: false
      required: [sampleLimit, sampledCount, items]
      properties:
        sampleLimit: {type: integer, const: 50}
        sampledCount: {type: integer, minimum: 0, maximum: 50}
        items:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/DemoDeliveryAttentionItem'}
    DemoDeliveryAttentionItem:
      type: object
      additionalProperties: false
      required: [transferId, decidedAt, amount, unit, sourceAccountId, destinationAccountId, attentionState, publicationStatus, attemptCount, lastErrorCode, nextAttemptAt]
      properties:
        transferId: {type: string, format: uuid}
        decidedAt: {type: string, format: date-time}
        amount: {type: integer, format: int64, minimum: 1, maximum: 9000000000000000}
        unit: {type: string, const: FIC}
        sourceAccountId: {type: string, format: uuid}
        destinationAccountId: {type: string, format: uuid}
        attentionState:
          type: string
          enum: [INCONSISTENT, BLOCKED, PUBLICATION_UNCONFIRMED, AWAITING_PUBLICATION, AWAITING_PROJECTION]
          description: Severity order. PUBLICATION_UNCONFIRMED means matching activity is already projected but publication is still pending or claimed.
        publicationStatus: {type: [string, 'null'], enum: [null, PENDING, CLAIMED, PUBLISHED, BLOCKED]}
        attemptCount: {type: [integer, 'null'], minimum: 0}
        lastErrorCode: {type: [string, 'null'], maxLength: 64}
        nextAttemptAt: {type: [string, 'null'], format: date-time}
    LedgerEntry:
      type: object
      required: [id, transferId, accountId, delta, createdAt]
      properties:
        id: {type: integer, format: int64}
        transferId: {type: string, format: uuid}
        accountId: {type: string, format: uuid}
        delta: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
    Error:
      type: object
      required: [code, message, correlationId]
      properties:
        code: {type: string}
        message: {type: string}
        correlationId: {type: string}
    TransferCompletedEvent:

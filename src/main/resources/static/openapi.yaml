        admitting: {type: boolean}
        reason:
          type: string
          enum: [disabled, none, unavailable, stale, unpublished_count, unpublished_age, published_unprocessed_count, published_unprocessed_age, recovering]
        pressure:
          oneOf:
            - {$ref: '#/components/schemas/BacklogPressure'}
            - {type: 'null'}
        observedAt: {type: [string, 'null'], format: date-time}
        sampleAgeSeconds: {type: [number, 'null'], minimum: 0}

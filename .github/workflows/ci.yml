name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS'
          verify-signature: true
          cache: maven
      - name: Clean build and real PostgreSQL/Kafka failure tests
        run: ./mvnw -B -ntp clean verify
      - name: Check benchmark CLIs
        run: |
          python3 scripts/benchmark.py --help
          python3 scripts/event-benchmark.py --help
          python3 scripts/phase3-experiments.py --help
          python3 scripts/analyze-jfr.py --help
          python3 scripts/summarize-phase3.py --help
          python3 scripts/demo.py --help
          python3 scripts/demo.py --dry-run
          python3 scripts/security-patch-comparison.py --help
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/render-showcase.py --check
      - name: Build runtime image
        run: docker build -t transaction-processing-platform:ci .
      - name: Guarded normal and broker-outage demos
        env:
          COMPOSE_PROJECT_NAME: tpp-ci-${{ github.run_id }}-${{ github.run_attempt }}
          DB_PORT: 55432
          APP_PORT: 18080
          KAFKA_PORT: 19092
        run: |
          python3 scripts/demo.py --project "$COMPOSE_PROJECT_NAME" --app-port 18080 --db-port 55432 --kafka-port 19092 --output benchmark-results/ci-normal.json
          python3 scripts/demo.py --project "$COMPOSE_PROJECT_NAME" --app-port 18080 --db-port 55432 --kafka-port 19092 --no-build --broker-outage --output benchmark-results/ci-outage.json
      - name: Verify receipt recovery and delivery lookup on the running demo
        run: |
          python3 scripts/verify-transfer-client.py --base-url http://127.0.0.1:18080 --cli scripts/transfer-client.py > benchmark-results/ci-transfer-recovery.json
          transfer_id=$(python3 -c 'import json,uuid; print(uuid.UUID(json.load(open("benchmark-results/ci-transfer-recovery.json"))["transferId"]))')
          python3 scripts/transfer-client.py status --endpoint http://127.0.0.1:18080 --transfer-id "$transfer_id" > benchmark-results/ci-transfer-status.json
          python3 - <<'PY_VERIFY'
          import json
          from pathlib import Path
          recovery = json.loads(Path("benchmark-results/ci-transfer-recovery.json").read_text())
          status = json.loads(Path("benchmark-results/ci-transfer-status.json").read_text())
          if not (recovery["complete"] and all(recovery["checks"].values())
                  and status["httpStatus"] == 200 and status["state"] == "OBSERVED"
                  and status["result"]["transferStatus"] == "COMPLETED"
                  and status["result"]["deliveryState"] == "PROJECTED"
                  and status["result"]["transferId"] == recovery["transferId"]
                  and status["result"]["event"]["eventId"] == recovery["eventId"]):
              raise SystemExit("Receipt recovery and delivery status disagree about the original transfer")
          print("PASS: a post-commit response loss recovered the original transfer; read-only lookup found its single projection.")
          PY_VERIFY
      - name: Verify browser receipt handoff and ledger proof on the running demo
        timeout-minutes: 5
        run: |
          google-chrome --version
          python3 -m venv "$RUNNER_TEMP/tpp-playwright"
          "$RUNNER_TEMP/tpp-playwright/bin/python" -m pip install --disable-pip-version-check playwright==1.57.0
          "$RUNNER_TEMP/tpp-playwright/bin/python" scripts/verify-browser-demo.py --base-url http://127.0.0.1:18080 --channel chrome --output benchmark-results/ci-browser-demo.json
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (Node 24)
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            benchmark-results/ci-*.json
            benchmark-results/ci-*.log
          if-no-files-found: warn
      - name: Clean up this CI project's containers
        if: always()
        env:
          COMPOSE_PROJECT_NAME: tpp-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker compose --file compose.yaml --project-name "$COMPOSE_PROJECT_NAME" down --volumes
